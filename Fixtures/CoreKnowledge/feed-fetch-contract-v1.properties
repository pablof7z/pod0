# Cross-platform compatibility fixture for the durable feed-fetch family.
# From contract version 53 a Succeeded feed command (Subscribe, Ensure,
# Refresh, HydrateMetadata) means the intent is durably queued — not that
# the feed has been fetched and applied. Application progress is projected
# through LibraryProjection.feed_fetches.
fixture_version=1
contract_version=53
subscribe_succeeded_meaning=durably-queued
retry_base_milliseconds=60000
retry_max_milliseconds=21600000
retry_not_before_attempt_1=1000060000
retry_not_before_attempt_2=1000120000
retry_not_before_attempt_10=1021600000
retry_observed_at_milliseconds=1000000000
max_feed_fetch_attempts=8
host_request_deadline_milliseconds=86400000
unknown_future_field=ignored-by-v1-readers
