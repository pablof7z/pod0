[package]
name = "pod0-tts-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false
description = "Portable ElevenLabs-compatible TTS generation for Pod0 hosts"

[dependencies]
# reqwest, serde, sha2, tracing, and zeroize are MIT OR Apache-2.0.
# tokio is MIT.
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = { version = "=0.10.9" }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "sync", "time"] }
tracing = { version = "=0.1.44" }
zeroize = { version = "=1.9.0" }

[dev-dependencies]
# serde_json is MIT OR Apache-2.0; tokio is MIT.
serde_json = { version = "=1.0.150" }
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[lib]
path = "src/lib.rs"
