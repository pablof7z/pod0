[package]
name = "pod0-nostr-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
futures-util = { version = "=0.3.34", features = ["sink"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "schnorr", "std"] }
log = { version = "=0.4.33", features = ["max_level_info"] }
nostr = { version = "=0.44.6", default-features = false, features = ["std"] }
pod0-application = { path = "../pod0-application", version = "=0.1.0" }
pod0-domain = { path = "../pod0-domain", version = "=0.1.0" }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = { version = "=0.10.9" }
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt", "time"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
url = { version = "=2.5.7" }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[lib]
path = "src/lib.rs"
